services:
  # 1. Define the PostgreSQL database service
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bank_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - banking-network

  # 2. Define the Account Service
  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    container_name: account-service
    ports:
      - "${ACCOUNT_SERVICE_PORT:-8081}:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/banking_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: 86400000
    depends_on:
      postgres:
        condition: service_healthy # Now Docker can match this to the 'postgres' block above!
    networks:
      - banking-network

networks:
  banking-network:
    driver: bridge