server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Public Auth Routes
        - id: auth-service
          uri: http://auth-service:8082
          predicates:
            - Path=/api/auth/**

        # Protected Account Routes
        - id: account-service
          uri: http://account-service:8081
          predicates:
            - Path=/api/accounts/**
          filters:
            - AuthenticationFilter

        # Protected Transaction Routes
        - id: transaction-service
          uri: http://transaction-service:8083
          predicates:
            - Path=/api/transactions/**
          filters:
            - AuthenticationFilter

        # Notification  Service Routes
        - id: notification-service
          uri: http://notification-service:8085
          predicates:
            - Path=/api/notifications/**
          filters:
            - AuthenticationFilter

        # Protected payment Routes
        - id: payment-service
          uri: http://payment-service:8084
          predicates:
            - Path=/api/transfers/**
          filters:
            - AuthenticationFilter

